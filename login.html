<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERPNext Sign-In &bull; FinGuard AI Financial Security</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --text: #0f172a;
      --text-2: #334155;
      --text-muted: #64748b;
      --text-disabled: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-light: #eff6ff;
      --primary-mid: #bfdbfe;
      --danger: #ef4444;
      --danger-light: #fef2f2;
      --danger-mid: #fecaca;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --warning-mid: #fde68a;
      --success: #10b981;
      --success-light: #ecfdf5;
      --success-mid: #a7f3d0;
      --radius: 16px;
      --radius-sm: 8px;
      --radius-xs: 6px;
      --shadow-sm: 0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
      --shadow: 0 4px 12px rgba(15,23,42,.08), 0 2px 4px rgba(15,23,42,.04);
      --shadow-lg: 0 20px 50px rgba(15,23,42,.10), 0 8px 24px rgba(15,23,42,.06);
      --transition: all .18s cubic-bezier(.4,0,.2,1);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.04) 0%, transparent 50%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }
    .login-container {
      width: 100%;
      max-width: 460px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 36px;
      box-shadow: var(--shadow-lg);
      position: relative;
    }
    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
    }
    .brand-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #2563eb, #06b6d4);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #fff;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
      margin-bottom: 12px;
    }
    .brand-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: var(--text);
    }
    .brand-subtitle {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-top: 3px;
    }
    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-light);
      border: 1px solid var(--primary-mid);
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 600;
      margin-top: 10px;
    }
    .tabs-header {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 3px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 7px;
      font-size: 0.78rem;
      font-weight: 600;
      text-align: center;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
    }
    .tab-btn.active {
      background: var(--surface);
      color: var(--primary);
      font-weight: 700;
      box-shadow: 0 1px 3px rgba(15,23,42,.08);
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-2);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .form-input {
      width: 100%;
      background: #fafafa;
      border: 1px solid var(--border-strong);
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.875rem;
      transition: var(--transition);
      outline: none;
    }
    .form-input:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }
    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      box-shadow: 0 3px 12px rgba(59, 130, 246, 0.35);
      transition: var(--transition);
      font-family: inherit;
    }
    .btn-submit:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 16px rgba(59, 130, 246, 0.5);
      transform: translateY(-1px);
    }
    .error-alert {
      display: none;
      background: var(--danger-light);
      border: 1px solid var(--danger-mid);
      color: var(--danger);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      margin-bottom: 16px;
      line-height: 1.4;
      font-weight: 500;
    }
    .demo-accounts-wrap {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }
    .demo-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 10px;
      text-align: center;
    }
    .demo-pill-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .demo-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
      transition: var(--transition);
      text-align: left;
    }
    .demo-pill:hover {
      background: var(--primary-light);
      border-color: var(--primary-mid);
    }
    .demo-name {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text);
    }
    .demo-role {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 500;
    }
    .demo-pill:hover .demo-role {
      color: var(--primary);
    }
    .back-home {
      margin-top: 20px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .back-home a {
      color: var(--text-2);
      font-weight: 600;
      transition: var(--transition);
    }
    .back-home a:hover {
      color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <div class="brand-icon">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <div class="brand-title">FinGuard AI</div>
      <div class="brand-subtitle">Financial Anomaly Detection</div>
      <div class="auth-badge">
        <i class="fa-solid fa-lock"></i> ERPNext Accounts Authentication Gate
      </div>
    </div>

    <!-- Error Banner -->
    <div class="error-alert" id="error-box"></div>

    <!-- Tabs Header -->
    <div class="tabs-header">
      <div class="tab-btn active" id="tab-btn-user" onclick="switchAuthTab('user')">
        <i class="fa-solid fa-user"></i> ERPNext User
      </div>
      <div class="tab-btn" id="tab-btn-token" onclick="switchAuthTab('token')">
        <i class="fa-solid fa-key"></i> API Token
      </div>
    </div>

    <!-- Mode 1: User / Password Form -->
    <form id="form-user" onsubmit="handleUserLogin(event)">
      <div class="form-group">
        <label class="form-label">ERPNext User / Email</label>
        <input type="text" id="login-username" class="form-input" placeholder="e.g. administrator or accounts.manager@apex.erp" required>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="login-password" class="form-input" placeholder="Enter ERPNext account password" required>
      </div>

      <div class="form-group">
        <label class="form-label">ERPNext Site URL</label>
        <input type="text" id="login-site" class="form-input" value="http://localhost:8000" style="font-family: 'JetBrains Mono', monospace; font-size: 0.82rem;">
      </div>

      <button type="submit" class="btn-submit" id="btn-submit-user">
        <i class="fa-solid fa-fingerprint"></i> Authenticate & Enter Console
      </button>
    </form>

    <!-- Mode 2: API Token Form -->
    <form id="form-token" style="display: none;" onsubmit="handleTokenLogin(event)">
      <div class="form-group">
        <label class="form-label">ERPNext API Key</label>
        <input type="text" id="login-api-key" class="form-input" placeholder="e.g. 4a8b79e19d..." style="font-family: 'JetBrains Mono';" required>
      </div>

      <div class="form-group">
        <label class="form-label">ERPNext API Secret</label>
        <input type="password" id="login-api-secret" class="form-input" placeholder="e.g. 9f12d8a0..." style="font-family: 'JetBrains Mono';" required>
      </div>

      <button type="submit" class="btn-submit" id="btn-submit-token">
        <i class="fa-solid fa-key"></i> Validate API Token
      </button>
    </form>

    <!-- 1-Click Verified ERPNext Demo Accounts -->
    <div class="demo-accounts-wrap">
      <div class="demo-title"><i class="fa-solid fa-id-badge"></i> Quick 1-Click ERPNext Accounts:</div>
      <div class="demo-pill-grid">
        <div class="demo-pill" onclick="quickFill('administrator', 'admin')">
          <div class="demo-name">Administrator</div>
          <div class="demo-role">System Manager</div>
        </div>
        <div class="demo-pill" onclick="quickFill('accounts.manager@apex.erp', 'finance123')">
          <div class="demo-name">CA Rajesh Sharma</div>
          <div class="demo-role">Accounts Manager</div>
        </div>
        <div class="demo-pill" onclick="quickFill('analyst.ananya@apex.erp', 'audit2026')">
          <div class="demo-name">Ananya Verma</div>
          <div class="demo-role">Internal Auditor</div>
        </div>
        <div class="demo-pill" onclick="quickFill('cfo.priya@apex.erp', 'cfo9900')">
          <div class="demo-name">Priya Patel</div>
          <div class="demo-role">Financial Controller</div>
        </div>
      </div>
    </div>

    <div class="back-home">
      <a href="/"><i class="fa-solid fa-arrow-left"></i> Return to Product Landing Page</a>
    </div>
  </div>

  <script>
    let activeTab = 'user';

    function switchAuthTab(tab) {
      activeTab = tab;
      document.getElementById('error-box').style.display = 'none';
      if (tab === 'user') {
        document.getElementById('form-user').style.display = 'block';
        document.getElementById('form-token').style.display = 'none';
        document.getElementById('tab-btn-user').classList.add('active');
        document.getElementById('tab-btn-token').classList.remove('active');
      } else {
        document.getElementById('form-user').style.display = 'none';
        document.getElementById('form-token').style.display = 'block';
        document.getElementById('tab-btn-user').classList.remove('active');
        document.getElementById('tab-btn-token').classList.add('active');
      }
    }

    function quickFill(usr, pwd) {
      switchAuthTab('user');
      document.getElementById('login-username').value = usr;
      document.getElementById('login-password').value = pwd;
      document.getElementById('btn-submit-user').click();
    }

    async function handleUserLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById('error-box');
      const btn = document.getElementById('btn-submit-user');
      errBox.style.display = 'none';

      const usr = document.getElementById('login-username').value.trim();
      const pwd = document.getElementById('login-password').value;
      const site = document.getElementById('login-site').value.trim();

      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating with ERPNext...';
      btn.disabled = true;

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode: 'user', username: usr, password: pwd, site_url: site })
        });

        const data = await resp.json();
        if (data.success) {
          // Store session
          localStorage.setItem('finguard_session', JSON.stringify(data.user));
          btn.innerHTML = '<i class="fa-solid fa-check"></i> Authorized! Entering...';
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 400);
        } else {
          errBox.textContent = data.message || 'Authentication failed: Invalid ERPNext credentials or insufficient role permissions.';
          errBox.style.display = 'block';
          btn.innerHTML = '<i class="fa-solid fa-fingerprint"></i> Authenticate & Enter Console';
          btn.disabled = false;
        }
      } catch (err) {
        errBox.textContent = 'Network error connecting to ERPNext authentication handler.';
        errBox.style.display = 'block';
        btn.innerHTML = '<i class="fa-solid fa-fingerprint"></i> Authenticate & Enter Console';
        btn.disabled = false;
      }
    }

    async function handleTokenLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById('error-box');
      const btn = document.getElementById('btn-submit-token');
      errBox.style.display = 'none';

      const apiKey = document.getElementById('login-api-key').value.trim();
      const apiSecret = document.getElementById('login-api-secret').value.trim();

      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Validating Token...';
      btn.disabled = true;

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode: 'token', api_key: apiKey, api_secret: apiSecret })
        });

        const data = await resp.json();
        if (data.success) {
          localStorage.setItem('finguard_session', JSON.stringify(data.user));
          btn.innerHTML = '<i class="fa-solid fa-check"></i> Token Validated!';
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 400);
        } else {
          errBox.textContent = data.message || 'API Token Authentication failed.';
          errBox.style.display = 'block';
          btn.innerHTML = '<i class="fa-solid fa-key"></i> Validate API Token';
          btn.disabled = false;
        }
      } catch (err) {
        errBox.textContent = 'Connection error communicating with authentication API.';
        errBox.style.display = 'block';
        btn.innerHTML = '<i class="fa-solid fa-key"></i> Validate API Token';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
